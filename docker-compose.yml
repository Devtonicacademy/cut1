# Production stack: Caddy (HTTPS) -> web (Next.js) + api (FastAPI + scheduler, SQLite on a volume)
#   1. copy .env.example to .env and fill it in (ADMIN_TOKEN, FOOTBALL_DATA_KEY, ...)
#   2. set SITE_ADDRESS in .env to your domain, e.g. livelyborg.duckdns.org
#   3. docker compose up -d --build
# See DEPLOY.md for the full guide.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - livelyborg-data:/app/data  # database, model, backups: survives rebuilds
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  livelyborg-data:
  caddy-data:
  caddy-config:
