services:
  - type: web
    name: livelyborg-api
    env: python
    plan: free
    region: frankfurt # Low latency to Nigeria & Europe
    buildCommand: pip install -r apps/api/requirements.txt
    startCommand: uvicorn apps.api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false
